<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions of Gradients and Filters -->
  <defs>
    <!-- Dark charcoal background radial gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Glowing Blue-to-Indigo Arc Gradient -->
    <linearGradient id="arcGrad" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="1.0" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="1.0" />
    </linearGradient>

    <!-- Glassmorphic border outline gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Diagonal glass reflection highlight -->
    <linearGradient id="glossGrad" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow effect for the neon arc -->
    <filter id="arcGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip path matching the squircle shape for internal highlights -->
    <clipPath id="cardClip">
      <rect x="32" y="32" width="448" height="448" rx="114" />
    </clipPath>
  </defs>

  <!-- 1. Ambient Neon Blue Glow behind the card (Bleeding from the bottom) -->
  <ellipse cx="256" cy="484" rx="160" ry="20" fill="#3b82f6" opacity="0.65" filter="blur(22px)" />

  <!-- 2. Main App Icon Squircle Backplate -->
  <rect x="32" y="32" width="448" height="448" rx="114" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- 3. Glassmorphic Gloss / Diagonal Reflection Highlight (Clipped) -->
  <rect x="32" y="32" width="448" height="448" rx="114" fill="url(#glossGrad)" clip-path="url(#cardClip)" pointer-events="none" />

  <!-- 4. Cosmic Background Stars / Micro-Detail Sparkles -->
  <g opacity="0.75">
    <circle cx="160" cy="180" r="1" fill="#ffffff" opacity="0.4" />
    <circle cx="360" cy="150" r="1.5" fill="#60a5fa" opacity="0.6" />
    <circle cx="220" cy="120" r="1" fill="#ffffff" opacity="0.3" />
    <circle cx="300" cy="380" r="1.2" fill="#818cf8" opacity="0.5" />
    <circle cx="140" cy="280" r="1.5" fill="#ffffff" opacity="0.5" />
    <circle cx="340" cy="330" r="1" fill="#60a5fa" opacity="0.3" />
    <circle cx="200" cy="360" r="1.2" fill="#ffffff" opacity="0.4" />
    <circle cx="280" cy="160" r="1" fill="#ffffff" opacity="0.2" />
    <circle cx="180" cy="220" r="1.5" fill="#818cf8" opacity="0.6" />
  </g>

  <!-- 5. Concentric background circular tracks -->
  <circle cx="256" cy="256" r="125" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.12" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#4f46e5" stroke-width="1.0" opacity="0.08" />
  <circle cx="256" cy="256" r="90" fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.06" />

  <!-- 6. Glowing Neon Arc (Tapered feel, sweeps from bottom-left to top-right) -->
  <path d="M 160 336 A 125 125 0 1 1 373 213" fill="none" stroke="url(#arcGrad)" stroke-width="32" stroke-linecap="round" filter="url(#arcGlow)" />

  <!-- 7. Lens Flare / Sparkling Star at 3 o'clock position (Outside arc edge) -->
  <g transform="translate(376, 250)">
    <circle cx="0" cy="0" r="18" fill="#60a5fa" opacity="0.5" filter="blur(5px)" />
    <!-- Horizontal Flare -->
    <path d="M -22 0 Q 0 0 22 0 Q 0 0 -22 0" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <!-- Vertical Flare -->
    <path d="M 0 -22 Q 0 0 0 22 Q 0 0 0 -22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <!-- Bright Star Center -->
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- 8. Sleek Optically-Centered Typography -->
  <!-- "THE" with +7px offset to balance 14px letter-spacing -->
  <text x="256" dx="7" y="214" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="300" letter-spacing="14" fill="#cbd5e1" opacity="0.9">THE</text>
  <!-- "ARC" with +9px offset to balance 18px letter-spacing -->
  <text x="256" dx="9" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="200" letter-spacing="18" fill="#ffffff">ARC</text>
  <!-- Subtitle with +1.75px offset to balance 3.5px letter-spacing -->
  <text x="256" dx="1.75" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.5" fill="#818cf8" opacity="0.8">ATTENDANCE RECORD COMPANION</text>
</svg>
